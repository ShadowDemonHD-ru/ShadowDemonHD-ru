<svg xmlns="http://www.w3.org/2000/svg" width="620" height="236" viewBox="0 0 620 236" role="img" aria-label="Gravastar">
<style>@font-face{font-family:UnbL;font-weight:200 900;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:UnbC;font-weight:200 900;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:ManL;font-weight:200 800;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:ManC;font-weight:200 800;src:url(data:font/woff2;base64,) format('woff2')}
.gl{transform-origin:116px 118px;animation:gl 6s ease-in-out infinite}
.dot{animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
@keyframes gl{0%,100%{opacity:.45;transform:scale(.9)}50%{opacity:.9;transform:scale(1.1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
  <clipPath id="c"><rect width="620" height="236" rx="20"/></clipPath>
  <radialGradient id="g"><stop offset="0" stop-color="#7B5CFF" stop-opacity=".45"/><stop offset="1" stop-color="#7B5CFF" stop-opacity="0"/></radialGradient>
  <linearGradient id="top" x1="0" x2="1"><stop offset="0" stop-color="#7B5CFF"/><stop offset="1" stop-color="#7B5CFF" stop-opacity="0"/></linearGradient>
</defs>
<g clip-path="url(#c)">
  <rect width="620" height="236" fill="#121118"/>
  <circle class="gl" cx="116" cy="118" r="110" fill="url(#g)"/>
  <rect width="620" height="2" fill="url(#top)"/>
  <g transform="translate(56 58)"><image href="data:image/png;base64," x="-47" y="-47" width="214" height="214" style="image-rendering:pixelated"/></g>
  <text x="240" y="70" style="font-family:UnbL,UnbC,sans-serif" font-size="25" font-weight="700" fill="#F2F2F4">Gravastar</text>
  <text style="font-family:ManL,ManC,sans-serif" font-size="16" font-weight="500" fill="rgba(242,242,244,.68)"><tspan x="240" y="108">Stream control app in Python. It ships</tspan><tspan x="240" y="132">OBS widgets with its own HTTPS server,</tspan><tspan x="240" y="156">a moderated chat and auto-updates.</tspan></text>
  <g transform="translate(240 184)"><g transform="translate(0.0 0)"><rect width="68.4" height="28" rx="14" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".12"/><text x="34.2" y="19" text-anchor="middle" style="font-family:ManL,ManC,sans-serif" font-size="13" font-weight="700" fill="rgba(242,242,244,.68)">Python</text></g><g transform="translate(76.4 0)"><rect width="102.0" height="28" rx="14" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".12"/><text x="51.0" y="19" text-anchor="middle" style="font-family:ManL,ManC,sans-serif" font-size="13" font-weight="700" fill="rgba(242,242,244,.68)">JavaScript</text></g><g transform="translate(186.4 0)"><rect width="43.2" height="28" rx="14" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".12"/><text x="21.6" y="19" text-anchor="middle" style="font-family:ManL,ManC,sans-serif" font-size="13" font-weight="700" fill="rgba(242,242,244,.68)">OBS</text></g></g>
  
</g>
<rect x=".5" y=".5" width="619" height="235" rx="19.5" fill="none" stroke="#2A2640"/>
</svg>