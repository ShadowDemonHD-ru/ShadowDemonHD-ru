<svg xmlns="http://www.w3.org/2000/svg" width="620" height="236" viewBox="0 0 620 236" role="img" aria-label="OBS widgets">
<style>@font-face{font-family:UnbL;font-weight:200 900;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:UnbC;font-weight:200 900;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:ManL;font-weight:200 800;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:ManC;font-weight:200 800;src:url(data:font/woff2;base64,) format('woff2')}
